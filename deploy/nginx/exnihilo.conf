# ============================================================================
# ExNihilo / SFO - nginx sur l'hôte : fichiers statiques + reverse proxy
# À copier dans /etc/nginx/sites-available/exnihilo puis :
#   sudo ln -s /etc/nginx/sites-available/exnihilo /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Remplacer sfo.axentia.fr par le domaine retenu (2 occurrences).
#
# HTTPS - deux options (cf. INSTALL.md) :
#   A) Let's Encrypt : lancer `sudo certbot --nginx -d sfo.axentia.fr`
#      certbot ajoute lui-même les lignes ssl_* et la redirection 80->443.
#   B) Certificat Axentia : décommenter le bloc "OPTION B" ci-dessous et
#      déposer les fichiers cert/clé aux chemins indiqués.
# ============================================================================

server {
    listen 80;
    server_name sfo.axentia.fr;

    # --- OPTION B : certificat fourni par la DSI Axentia -------------------
    # listen 443 ssl;
    # ssl_certificate     /etc/ssl/axentia/sfo.axentia.fr.crt;
    # ssl_certificate_key /etc/ssl/axentia/sfo.axentia.fr.key;
    # if ($scheme = http) { return 301 https://$host$request_uri; }
    # ------------------------------------------------------------------------

    # Fichiers statiques de l'application (index.html, app.js, styles.css)
    root /var/www/exnihilo;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    location / {
        try_files $uri $uri/ =404;
        # Les fichiers portent un cache-buster ?v=N : cache long autorisé
        add_header Cache-Control "public, max-age=3600";
    }

    # --- API données : mêmes chemins que Supabase -> zéro changement du code
    # /rest/v1/operations  ->  PostgREST /operations
    location /rest/v1/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Requêtes potentiellement volumineuses (sauvegarde d'opération complète)
        client_max_body_size 20m;
    }

    # --- Authentification : /auth/v1/token -> GoTrue /token
    location /auth/v1/ {
        proxy_pass http://127.0.0.1:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rien d'autre n'est exposé : Postgres (5432), PostgREST (3000) et GoTrue
    # (9999) n'écoutent qu'en 127.0.0.1 (cf. docker-compose.yml).
}
